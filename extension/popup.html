<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradezy</title><style>body{width:390px;margin:0;background:#f7f8fa;color:#1b302b;font:13px system-ui,sans-serif}header{background:#fff;padding:22px 24px;border-bottom:1px solid #e8edeb}h1{font-size:23px;letter-spacing:-1px;margin:0}main{padding:20px 24px}p{color:#70817a;line-height:1.6}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#6d9685}button{width:100%;border:0;border-radius:11px;background:#1d5945;color:white;font-weight:600;padding:13px;cursor:pointer}button:disabled{opacity:.5}#results{margin-top:20px}table{border-collapse:collapse;font-size:11px;width:100%;background:white}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#export{margin-top:12px;background:#fff;border:1px solid #cbd8d1;color:#1d5945}#status{min-height:18px}small{color:#82918a}</style></head><body><header><div class="eyebrow">Assessment companion</div><h1>gradezy.</h1></header><main><h2>Capture Moodle records</h2><p>Read the currently displayed assessment table from your signed-in Moodle tab. Nothing is sent to a server.</p><button id="capture">Capture visible records</button><p id="status" role="status"></p><section id="results" hidden><strong id="count"></strong><div style="overflow:auto;max-height:260px;margin-top:12px"><table id="preview"></table></div><button id="export">Export captured CSV</button><small>Only visible table rows are captured. Check pagination, hidden columns and records before use.</small></section></main><script src="popup.js"></script></body></html>
